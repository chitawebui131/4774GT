# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# GitHub recommends pinning actions to a commit SHA.
# To get a newer version, you will need to update the SHA.
# You can also reference a tag or branch, but the action may change without warning.

name: Ruby

env:
  SECRETS_TOKEN: ${{ secrets.PAT }}

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4   # або @v5, якщо підтверджено

      # Крок з GitHub App і запрошенням в org можна повністю прибрати
      # (він не потрібен для проходження тестів і ламається на user-акаунті)

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          working-directory: '.github/tests'
          bundler-cache: true

      - name: Run tests
        env:
          URL: ${{ github.repository }}
          TOKEN: ${{ secrets.PAT }}          # ← головна зміна
          SECRETS_TOKEN: ${{ secrets.PAT }}
        working-directory: '.github/tests'
        run: ruby test/script_test.rb
